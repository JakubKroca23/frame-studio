# /models/* (CAD models, incl. the Volvo chassis approved by Jakub) only for users logged in to the app: the app's
# password login sets trw's HttpOnly cookie trw_session (Domain=propoj.app, so the browser sends it here too);
# nginx validates it against trw /api/auth/me (results cached 5 min per cookie). No cookie / invalid → 403.
proxy_cache_path /var/cache/nginx/auth levels=1 keys_zone=fsauth:1m max_size=10m inactive=10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # application/wasm for .wasm comes from nginx:alpine default mime.types

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /models/ {
        auth_request /_auth;
        error_page 401 = @forbidden;
        add_header Cache-Control "private, no-cache";
        try_files $uri =404;
    }

    location @forbidden {
        return 403;
    }

    location = /_auth {
        internal;
        resolver 127.0.0.11 1.1.1.1 valid=300s ipv6=off;
        set $trw https://trw.propoj.app;
        proxy_pass $trw/api/auth/me;
        proxy_ssl_server_name on;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host trw.propoj.app;
        proxy_set_header Accept application/json;
        proxy_set_header Cookie $http_cookie;
        proxy_cache fsauth;
        proxy_cache_key $cookie_trw_session;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 401 10s;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        # no cookie → never ask trw
        if ($cookie_trw_session = "") { return 401; }
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
